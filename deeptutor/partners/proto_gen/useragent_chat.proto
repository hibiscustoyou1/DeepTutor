// 天翼云电脑内智能体 IM gRPC 协议（3.2.1）
// 来源：《天翼云电脑内智能体IM接入方案》proto 原文
// 重新生成：python scripts/generate_ctcloud_proto.py

syntax = "proto3";

package com.ctg.yilian.robot.grpc.useragent;

option java_multiple_files = true;
option java_outer_classname = "UserAgentChatProto";
option java_package = "com.ctg.yilian.robot.grpc.useragent.protobuf.generated";

service UserAgentChatService {
    // agent建立长连接，服务端下发相关事件消息
    rpc connect(ConnectRequest) returns (stream ServerEvent) {}
    // agent主动向IM用户或会话发送消息
    rpc sendMessage(SendMessageRequest) returns (SendMessageResponse) {}
}

message ConnectRequest {
}

message ServerEvent {
    // 服务端事件唯一标识
    string event_id = 1;
    // 服务端事件时间戳，单位毫秒
    int64 timestamp = 2;

    oneof event {
        // 收到的上行消息事件
        IncomingMessage received_message = 11;
    }
}

message IncomingMessage {
    // 平台侧消息唯一标识
    string message_id = 1;
    // 当前消息所属会话信息
    ChatContext chat = 2;
    // 消息发送人信息
    Sender sender = 3;
    // 收到的消息内容
    IncomingContent content = 4;
}

message SendMessageRequest {
    // 消息发送目标
    ChatTarget target = 1;
    // 要发送的消息内容
    OutgoingContent content = 2;
    // 调用方自定义消息标识，必须是UUID字符串。
    // 服务端使用该字段作为IMPacket.packetId，并在发送前先按该packetId查询IMPacket。
    // 若查询到已存在消息，则视为已处理过的重复请求，直接返回已受理结果，不再重复发送。
    // 若未查询到，则按新消息发送。
    string client_message_id = 3;
}

message SendMessageResponse {
    // 调用方传入的消息标识，原样回传
    string client_message_id = 1;

    oneof result {
        // 消息已被平台接受
        SendAccepted accepted = 2;
        // 消息发送失败信息
        ErrorInfo error = 3;
    }
}

message ChatContext {
    // 会话类型
    ConversationType conversation_type = 1;
    // 会话路由标识，仅用于回传 sendMessage，不保证可读，不应业务解析
    string conversation_id = 2;
    // 会话展示名称，仅用于展示，不参与 sendMessage 路由
    string conversation_name = 3;
}

message ChatTarget {
    oneof target {
        // 指定具体会话发送
        ChatContext chat = 1;
        // 发送给当前已绑定的用户
        BoundUserTarget bound_user = 2;
    }
}

message BoundUserTarget {
}

message Sender {
    // 发送人的 openId
    string open_id = 1;
    // 发送人的展示昵称
    string nickname = 2;
}

message IncomingContent {
    oneof body {
        // 纯文本消息内容
        TextContent text = 10;
        // Markdown 消息内容
        MarkdownContent markdown = 11;
        // 图片消息内容
        ImageContent image = 12;
        // 文件消息内容
        FileContent file = 13;
    }
}

message OutgoingContent {
    oneof body {
        // 纯文本消息内容
        TextContent text = 10;
        // Markdown 消息内容
        MarkdownContent markdown = 11;
        // 图片消息内容
        ImageContent image = 12;
        // 文件消息内容
        FileContent file = 13;
    }
}

message SendAccepted {
    // 平台侧已受理消息的唯一标识
    string message_id = 1;
    // 平台受理时间戳，单位毫秒
    int64 accepted_at = 2;
}

message ErrorInfo {
    // 错误码
    int64 code = 1;
    // 错误描述
    string message = 2;
}

message TextContent {
    // 文本内容
    string content = 1;
}

message MarkdownContent {
    // Markdown 卡片标题
    string title = 1;
    // Markdown 正文内容
    string text = 2;
}

message ImageContent {
    // 图片资源地址：
    // 1）智能体发送图片消息时，该值为3.2.2接口中的uuid
    // 2）智能体接收图片消息时，该值为完整的图片公网url，可直接下载到本地，然后使用 secret_key进行AES解密
    string url = 1;
    // 访问图片资源所需的密钥，AES加密密钥
    string secret_key = 2;
    // 图片尺寸，单位为像素
    ImageSize size = 3;
    // 图片文件大小，单位为字节
    optional int64 file_length = 4;
}

message FileContent {
    // 文件资源地址：
    // 1）智能体发送文件消息时，该值为3.2.2接口中的uuid
    // 2）智能体接收文件消息时，该值为完整的文件公网url，可直接下载到本地，然后使用 secret_key进行AES解密
    string url = 1;
    // 访问文件资源所需的密钥，AES加密密钥
    string secret_key = 2;
    // 文件名称
    string file_name = 3;
    // 文件大小，单位为字节
    optional int64 file_length = 4;
}

message ImageSize {
    // 图片高度，单位为像素
    int32 h = 1;
    // 图片宽度，单位为像素
    int32 w = 2;
}

enum ConversationType {
    CONVERSATION_TYPE_UNSPECIFIED = 0;
    SINGLE_CHAT = 1;
    GROUP_CHAT = 2;
}
