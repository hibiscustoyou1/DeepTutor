name: Ctcloud Desktop Build

# Fork-only workflow (the upstream desktop-release.yml stays untouched and its
# builds keep the in-repo placeholders). Builds the bundled desktop app with
# the ctcloud channel credentials baked in via scripts/build-with-secrets.mjs.
#
# Two modes:
#   - Publish: attach the downloads to the GitHub Release for the given tag
#     (triggered by a `release: published` event or a manual run with
#     publish=true). Requires contents: write so gh release upload can run.
#   - Validate: keep the downloads as workflow artifacts for 7 days (manual run
#     with publish=false, or a failed/partial publish).
#
# Required repository secrets:
#   CTCLOUD_APP_CODE, CTCLOUD_APP_SECRET   ctcloud channel credentials (YL-3rd-Appcode / sk)
#   DESKTOP_RUNTIME_SIGNING_KEY             optional — Ed25519 PEM matching
#                                           assets/runtime-public.pem; without it the
#                                           build falls back to a throwaway key (--new-key).
# ctmeta.exe is NOT bundled: on Windows the ctcloud channel reads it from the
# cloud-desktop client's fixed install path (see ctcloud.py), which a real
# cloud desktop always has.
# Apple Developer ID signing and notarization are skipped here; without them the
# Mac apps are signed ad hoc and Gatekeeper warns on first open (same as upstream).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the downloads to (required when publishing)
        required: false
        type: string
      publish:
        description: Attach downloads to the existing release instead of only validating
        type: boolean
        default: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
  PUBLISH: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}

permissions:
  contents: write

concurrency:
  group: ctcloud-desktop-build-${{ inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            name: Open DeepTutor for Windows (ctcloud build)
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      HAS_RUNTIME_KEY: ${{ secrets.DESKTOP_RUNTIME_SIGNING_KEY != '' }}
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PUBLISH == 'true' && env.RELEASE_TAG || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            web/package-lock.json

      - uses: astral-sh/setup-uv@v6

      - name: Install the Windows installer toolchain
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress

      - name: Check and test the shell
        run: npm ci && npm run check && npm test

      - name: Build with injected ctcloud credentials
        env:
          CTCLOUD_APP_CODE: ${{ secrets.CTCLOUD_APP_CODE }}
          CTCLOUD_APP_SECRET: ${{ secrets.CTCLOUD_APP_SECRET }}
          OPEN_DEEPTUTOR_SIGNING_KEY: ${{ secrets.DESKTOP_RUNTIME_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ "$HAS_RUNTIME_KEY" = "true" ]; then
            node scripts/build-with-secrets.mjs --target ${{ matrix.target }}
          else
            node scripts/build-with-secrets.mjs --target ${{ matrix.target }} --new-key
          fi

      - name: Attach the downloads to the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Each platform produces only its own downloads.
          shopt -s nullglob
          files=(out/*.dmg out/*-Setup.exe out/*-Portable.zip)
          [ ${#files[@]} -gt 0 ] || { echo "No downloads were produced." >&2; exit 1; }
          # Also attach copies without the version in the name, so the README
          # can link to releases/latest/download/<name> and always get the newest build.
          mkdir -p out/latest
          for f in "${files[@]}"; do
            name="$(basename "$f")"
            stable="${name/-$RELEASE_TAG/}"
            [ "$stable" != "$name" ] || { echo "Expected $RELEASE_TAG in $name." >&2; exit 1; }
            cp "$f" "out/latest/$stable"
          done
          gh release upload "$RELEASE_TAG" "${files[@]}" out/latest/* --clobber

      - name: Keep the validation build
        if: always() && env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ctcloud-${{ matrix.target }}
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/desktop/out/*.dmg
            apps/desktop/out/*-Setup.exe
            apps/desktop/out/*-Portable.zip
            apps/desktop/.local/${{ matrix.target }}/smoke.log
            apps/desktop/.local/${{ matrix.target }}/smoke-result.json
