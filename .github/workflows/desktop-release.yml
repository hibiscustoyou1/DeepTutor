name: Desktop Release

# Builds Open DeepTutor for Windows from feat-1.7.3. Personal fork edition:
# manual-trigger only — no push, PR or release event starts a build; run it
# from the Actions page (Run workflow → feat-1.7.3). macOS targets are removed.
# The build lives in apps/desktop/platforms/windows-x64/.
#
# Secrets:
#   DESKTOP_RUNTIME_SIGNING_KEY  (required for a stable signing identity)
#                                Ed25519 PEM matching
#                                apps/desktop/assets/runtime-public.pem.
#                                Without it the workflow seals with a throwaway
#                                key (--new-key) whose identity changes every run.
#   The Windows build is unsigned; SmartScreen warns on first open.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (required only when publishing)
        required: false
        type: string
      publish:
        description: Attach downloads to the existing release instead of only validating
        type: boolean
        default: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            name: Open DeepTutor for Windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      HAS_RUNTIME_KEY: ${{ secrets.DESKTOP_RUNTIME_SIGNING_KEY != '' }}
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PUBLISH == 'true' && env.RELEASE_TAG || '' }}

      - name: Verify release tag matches deeptutor/__version__.py
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^__version__ = "([^"]+)"/\1/p' ../../deeptutor/__version__.py | tr -d '\r')"
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "Release tag $RELEASE_TAG does not match deeptutor/__version__.py ($version)." >&2
            exit 1
          fi

      - name: Verify signing configuration
        run: |
          set -euo pipefail
          [ "$HAS_RUNTIME_KEY" = "true" ] || { echo "DESKTOP_RUNTIME_SIGNING_KEY is required for signed validation and releases." >&2; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            web/package-lock.json

      - uses: astral-sh/setup-uv@v6

      - name: Install the Windows installer toolchain
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress

      - name: Check and test the shell
        run: npm ci && npm run check && npm test

      - name: Build the bundled runtime
        env:
          OPEN_DEEPTUTOR_SIGNING_KEY: ${{ secrets.DESKTOP_RUNTIME_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ "$HAS_RUNTIME_KEY" = "true" ]; then
            npm run build:runtime -- --target ${{ matrix.target }}
          elif [ "$PUBLISH" = "true" ]; then
            echo "DESKTOP_RUNTIME_SIGNING_KEY is required to publish desktop apps." >&2
            exit 1
          else
            npm run build:runtime -- --target ${{ matrix.target }} --new-key
          fi

      - name: Boot the bundled runtime
        run: npm run smoke -- --target ${{ matrix.target }}

      - name: Package
        run: npm run package -- --target ${{ matrix.target }}

      - name: Verify Windows installation and app lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./platforms/windows-x64/smoke-installer.ps1

      - name: Verify the bundled CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./platforms/windows-x64/cli/smoke-cli.ps1

      - name: Attach the downloads to the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(out/*-Setup.exe out/*-Portable.zip)
          [ ${#files[@]} -gt 0 ] || { echo "No downloads were produced." >&2; exit 1; }
          # Also attach copies without the version in the name, so links can
          # point at releases/latest/download/<name> for the newest build.
          mkdir -p out/latest
          for f in "${files[@]}"; do
            name="$(basename "$f")"
            stable="${name/-$RELEASE_TAG/}"
            [ "$stable" != "$name" ] || { echo "Expected $RELEASE_TAG in $name." >&2; exit 1; }
            cp "$f" "out/latest/$stable"
          done
          gh release upload "$RELEASE_TAG" "${files[@]}" out/latest/* --clobber

      - name: Keep the validation build
        if: always() && env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          retention-days: 7
          path: |
            apps/desktop/out/*-Setup.exe
            apps/desktop/out/*-Portable.zip
            apps/desktop/.local/${{ matrix.target }}/smoke.log
            apps/desktop/.local/${{ matrix.target }}/smoke-result.json
            apps/desktop/.local/${{ matrix.target }}/installed-app.log
            apps/desktop/.local/${{ matrix.target }}/cli-smoke.log

  verify-release:
    name: Verify all desktop downloads are published
    needs: build
    if: always() && github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require successful builds and all release assets
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          script: |
            if (process.env.BUILD_RESULT !== 'success') {
              core.setFailed(`Desktop builds did not all succeed: ${process.env.BUILD_RESULT}`);
              return;
            }
            const tag = process.env.RELEASE_TAG;
            const { data: release } = await github.rest.repos.getReleaseByTag({
              ...context.repo, tag,
            });
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo, release_id: release.id, per_page: 100,
            });
            const versioned = [
              `Open-DeepTutor-Windows-${tag}-Setup.exe`,
              `Open-DeepTutor-Windows-${tag}-Portable.zip`,
            ];
            const expected = [...versioned, ...versioned.map(name => name.replace(`-${tag}`, ''))];
            const uploaded = new Set(assets
              .filter(asset => asset.state === 'uploaded' && asset.size > 0)
              .map(asset => asset.name));
            const missing = expected.filter(name => !uploaded.has(name));
            if (missing.length) {
              core.setFailed(`Desktop release is incomplete. Missing downloads: ${missing.join(', ')}`);
            } else {
              core.info(`Verified all ${expected.length} desktop downloads for ${tag}.`);
            }
